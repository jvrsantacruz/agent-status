---
name: "Bug"
description: "Something does not work as the README says"
body:
  - type: "textarea"
    id: "what"
    attributes:
      label: "What happened, and what you expected"
    validations:
      required: true
  - type: "textarea"
    id: "doctor"
    attributes:
      label: "Output of agent-status doctor"
      description: "Run it in the tmux window where the marker is wrong."
      render: "text"
    validations:
      required: true
  - type: "input"
    id: "agent"
    attributes:
      label: "Agent and version"
      placeholder: "Claude Code 2.1.300, pi 0.9, ..."
  - type: "input"
    id: "install"
    attributes:
      label: "How you installed it"
      placeholder: ".deb, Homebrew, go install"
