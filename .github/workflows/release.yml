---
name: "Release"

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: "read"

jobs:
  release:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30
    permissions:
      contents: "write"
      id-token: "write"
      attestations: "write"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "CHANGELOG.md opens with this version"
        run: "tools/check-changelog \"$GITHUB_REF_NAME\""
      - uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e"  # v7.0.0
        with:
          go-version-file: "go.mod"
          # No cache in a release job: a poisoned cache would be shipped.
          cache: false
      - uses: "anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c"  # v0.24.3
      - uses: "goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de"  # v7.3.0
        with:
          version: "v2.18.3"
          args: "release --clean"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          HOMEBREW_TAP_TOKEN: "${{ secrets.HOMEBREW_TAP_TOKEN }}"
      - name: "Provenance: which workflow built which file"
        uses: "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6"  # v4.2.2
        with:
          subject-checksums: "dist/checksums.txt"
      - name: "Publish the draft release"
        run: "gh release edit \"$GITHUB_REF_NAME\" --draft=false --latest"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
