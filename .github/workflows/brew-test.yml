name: brew-test

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linuxbrew:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Homebrew
        run: |
          NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "$HOME/.linuxbrew/bin" >> $GITHUB_PATH
      - name: Test formula
        run: |
          brew install --verbose Formula/agent-status.rb
          brew test agent-status
          watcher emit 2>&1 | grep -q usage

  homebrew:
    strategy:
      matrix:
        os: [macos-13, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install local formula
        run: |
          brew install --verbose Formula/agent-status.rb
      - name: Run test block
        run: |
          brew test agent-status
      - name: Verify service loads
        run: |
          brew services run agent-status &
          sleep 2
          brew services list | grep agent-status
      - name: Verify FIFO
        run: |
          ls -la "$HOME/.local/state/agent-status/" || echo "state dir created on first run"
