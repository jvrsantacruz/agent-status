---
name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  checks:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e"  # v7.0.0
        with:
          go-version-file: "go.mod"
      - uses: "astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7"  # v10.2.0
      - name: "Every pre-commit check, on every file"
        run: "uvx --from pre-commit==4.6.2 pre-commit run --all-files --show-diff-on-failure"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15"]
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 15
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          persist-credentials: false
      - uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e"  # v7.0.0
        with:
          go-version-file: "go.mod"
      - name: "Unit and end to end tests"
        run: "go test -race -tags e2e -count=1 ./..."

  vulncheck:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 10
    steps:
      - uses: "golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f"  # v1.1.0
        with:
          go-version-file: "go.mod"

  packages:
    runs-on: "ubuntu-24.04"
    timeout-minutes: 20
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e"  # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false
      - uses: "anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c"  # v0.24.3
      - name: "Build every archive and package, publish nothing"
        uses: "goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de"  # v7.3.0
        with:
          version: "v2.18.3"
          args: "release --snapshot --clean"
      - name: "The .deb installs, and its binary runs"
        run: |
          sudo apt-get install -y ./dist/agent-status_*_amd64.deb
          agent-status version
          test -f /usr/lib/systemd/user/agent-status.service
          test -f /usr/share/agent-status/agent-status.tmux
